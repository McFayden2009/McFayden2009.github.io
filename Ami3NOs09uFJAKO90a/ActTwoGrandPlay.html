<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActTwoGrandPlay</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FFF;
      background-image: url("theloraxyearns.png");
      background-size: 100% 100%;
      font-family: Arial, sans-serif;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      position: absolute;
      left: 40%;
      top: 20%;
      width: 22%;
      height: 12%;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 1% 1% 1% 1%;
      box-sizing: border-box;
      background-color: #343;
    }

    .box input {
      width: 92%;
      height: auto;
      background: transparent;
      border: none;
      outline: none;
      color: #00ff66;
      font-size: clamp(16px, 2vw, 28px);
      text-align: left;
      caret-color: #00ff66;
      font-family: monospace;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.4);
      align-self: flex-start;
    }

    .box input::placeholder {
      color: rgba(0, 255, 102, 0.5);
    }

    #resultBox {
      display: none;
      margin-top: 10%;
      width: 95%;
      height: 80%;
      position: absolute;
      resize: none;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 255, 102, 0.4);
      color: #00ff66;
      font-family: monospace;
      font-size: clamp(14px, 1.5vw, 20px);
      text-align: left;
      padding: 10px;
      box-sizing: border-box;
      align-self: flex-start;
    }

    #wrongCode {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      color: #ff6666;
      font-family: monospace;
      font-size: clamp(14px, 1.5vw, 20px);
      white-space: nowrap;
    }

    .hidden-submit {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    #typingOverlay {
      position: fixed;
      inset: 0;
      background: #FFF;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #typingText {
      width: 100%;
      height: 100%;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
      font-size: clamp(16px, 2vw, 28px);
      color: #00ff66;
      background: rgba(0, 0, 0, 0.95);
      border: 1px solid rgba(0, 255, 102, 0.4);
      padding: 20px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="box">
      <form id="codeForm" autocomplete="off">
        <input
          id="codeInput"
          type="text"
          placeholder="answer here"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button class="hidden-submit" type="submit">Submit</button>
      </form>

      <textarea id="resultBox" readonly></textarea>
      <div id="wrongCode"></div>
    </div>
  </div>

  <div id="typingOverlay">
    <div id="typingText"></div>
  </div>
	
<script>
  /*
   * ============================================================
   * ENCRYPTED REDIRECT
   * The decrypted value should be the URL directly.
   * No 10-character suffix is used.
   * ============================================================
   */
  const encryptedData =
    "7em/wFLtbG3mZcGXQ/bcDzXSyywweURd2imjChtbMh25OoVixj9/4BLOGrEpYv9JG5vYIyYpqXO5bQHELnbbMYuvTXOOZMiH8Bf0pSEtM89I0Q==";

  const saltB64 =
    "D1GXeo+UJAuUbHtfZs6u/g==";

  const ivB64 =
    "ZsBQWJ5PctlT2aqp";


  /*
   * ============================================================
   * ENCRYPTED DISPLAY MESSAGE
   * The decrypted value should be the display text directly.
   * ============================================================
   */
  const displayEncryptedData =
    "bGfY9aB+tDr2loKawp61bpzD1BeuGy3LbAxd6h/uXJ4ME95zKqlrwhThoI1nZxkKbrc52NfnV6Nz65GC0T+M0zYTNim9nEIurkDLBSxKKAZsaBoNlLL/oKP/NJxmhtq6RhzC83BxfYLlgkfsccieaX2uzsJH0QdPgG/t95p4hi2XugF+aPHyCHqDy24x2TW9oDf50FiliKBc+KRp7Q95p7wtB5T89cGFnQSKHwkHwUJRJLXNhuXJgyM3qN4uNahMPUxtaJdgFxCt99JqpVMUVrDG6x8rcaj7Q34/XteY4KvNkylVZtJckTv+WiRtaB6XfxV2yd4GI72g8vCaWmlVDMDVnJUL7sAaVQdxYuvEZSkQWH5PPlB3d7kNNDdYmufE2+Yk6vAvb0csAGTKBWEHzExqKAF0/FLBY+splbNdAEiVlGUov7s7ascxywAHTXOPhBQWowWYl1mi1brL+idecwrkH58EqwyVugW5C69N9UyR5V2jVlIGTQah5KekxKlsIzFEhvzUwZTif/W2lXWpKN18g20fJm45kNOExi8rLtFoJ/WNvptjPoNnDvnepaS0hKrY1v/b4kx67bLJukhWf+wNl320b+jCCPEd+mD5f232qgoiGYZQUxzhJR5tghA4/y1am8S7n03d6ImvzRNh82kl98QbKt31Xe7iOdCs00y21oA2xcCSwX4LNuPJ6e0pgKRpN9uzjYGRW1dBiJzRB4WXbjjsyQuYgO2bnSLUaSAYkVevmPMGqplh7QIzSX8HJZkPoA0WPr2Cfh2RUrIAXqb69btlEyKpQDk4z9CxmVCDSf7/z1S6kHAZfRhpAv6CGs9jEvrdkCDE5TGK14YinUpRtPObEfVajFrgVhD+AM8ZBoiuLLx0/04UzlJJbD9f+59epIQM2dZIV0YpSQTaXpczCErhF2SntMVN5OFw4X6Aij4Ep+ariNgAhFHAe1wHASkNNwJZtMobpVEQsnKIAfgd8bjsG7QnwlPapHw7BAxH0sPYu1wLQRPoQMZFqW5WPut+FZGQ79JTFI79B4oShJeswJZk0nljCfVaErLoF1AYUSkxb69rI/ub7wVHANamVNznI2YEILHzAGPtwP4N7oZrNAyddkSjCD9xAnAUB1CBKRSm6vJ9jO3pZwT/6LK44YPk5FdqhiMbxQU7wmEK7QK3+1oHli9JvD0otGzeEUMvoPrpurV9ImIWdfgT9g9Myu3f3d4WyxFtclN0gudbgnOuN28UgzAtldUB3pqBeAQT4bYxrn4dKlYl8ePjBfFbXt3kuswm93vzgZEwqcfclLI1XLcMz64AHwtP4mGSnG8x";

  const displaySaltB64 =
    "ORV2SszP5ChjAmHTQ6S79A==";

  const displayIvB64 =
    "Xvw2KPsm59Z0fKg8";


  /*
   * ============================================================
   * BASE64
   * ============================================================
   */
  function base64ToBytes(base64) {
    return Uint8Array.from(
      atob(base64),
      c => c.charCodeAt(0)
    );
  }


  /*
   * ============================================================
   * PBKDF2 KEY DERIVATION
   * ============================================================
   */
  async function deriveKey(password, salt) {
    const enc = new TextEncoder();

    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      enc.encode(password),
      { name: "PBKDF2" },
      false,
      ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: salt,
        iterations: 100000,
        hash: "SHA-256"
      },
      keyMaterial,
      {
        name: "AES-GCM",
        length: 256
      },
      false,
      ["decrypt"]
    );
  }


  /*
   * ============================================================
   * AES-GCM DECRYPTION
   * ============================================================
   */
  async function decryptWithPassword(
    cipherB64,
    saltB64,
    ivB64,
    password
  ) {
    const salt = base64ToBytes(saltB64);
    const iv = base64ToBytes(ivB64);
    const ciphertext = base64ToBytes(cipherB64);

    const key = await deriveKey(password, salt);

    const decryptedBuffer = await crypto.subtle.decrypt(
      {
        name: "AES-GCM",
        iv: iv
      },
      key,
      ciphertext
    );

    return new TextDecoder().decode(decryptedBuffer);
  }


  /*
   * ============================================================
   * TYPING EFFECT
   * ============================================================
   */
  function typeText(target, text, speed = 5) {
    return new Promise((resolve) => {
      target.textContent = "";

      let i = 0;

      const timer = setInterval(() => {
        target.textContent += text.charAt(i);

        playClick();

        i += 1;

        if (i >= text.length) {
          clearInterval(timer);
          resolve();
        }
      }, speed + Math.floor(Math.random() * 25));
    });
  }


  /*
   * ============================================================
   * MAIN FUNCTION
   * ============================================================
   */
  async function run() {
    /*
     * Automatically lowercase the code.
     */
    const password = document
      .getElementById("codeInput")
      .value
      .toLowerCase();

    const resultBox =
      document.getElementById("resultBox");

    const wrongCode =
      document.getElementById("wrongCode");


    /*
     * Clear previous error.
     */
    wrongCode.textContent = "";


    try {
      /*
       * Decrypt the URL.
       */
      const secretMessage = await decryptWithPassword(
        encryptedData,
        saltB64,
        ivB64,
        password
      );


      /*
       * Decrypt the display text.
       */
      const displaySecretMessage =
        await decryptWithPassword(
          displayEncryptedData,
          displaySaltB64,
          displayIvB64,
          password
        );


      /*
       * Make sure the decrypted URL looks valid.
       */
      if (!/^https?:\/\//i.test(secretMessage)) {
        throw new Error("Invalid decrypted URL");
      }


      /*
       * Hide the code input stage.
       */
      document.getElementById("stage").style.visibility =
        "hidden";


      /*
       * Show the typing overlay.
       */
      const typingOverlay =
        document.getElementById("typingOverlay");

      const typingText =
        document.getElementById("typingText");

      typingOverlay.style.display = "flex";


      /*
       * Type the decrypted display message.
       */
      await typeText(
        typingText,
        displaySecretMessage,
        100
      );


      /*
       * Redirect after the message finishes.
       */
      setTimeout(() => {
        window.location.href = secretMessage;
      }, 800);

    } catch (e) {
      console.error("Wrong code or decryption failed:", e);

      /*
       * Show wrong-code message.
       */
      if (resultBox) {
        resultBox.style.display = "none";
      }

      if (wrongCode) {
        wrongCode.style.display = "block";
        wrongCode.textContent = "Wrong code!";
      }
    }
  }


  /*
   * ============================================================
   * FORM SUBMIT
   * ============================================================
   */
  document
    .getElementById("codeForm")
    .addEventListener("submit", (e) => {
      e.preventDefault();
      run();
    });


  /*
   * ============================================================
   * AUDIO
   * ============================================================
   */
  let audioCtx = null;


  function playClick() {
    if (!audioCtx) {
      audioCtx = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    const now = audioCtx.currentTime;

    const osc =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();


    osc.type = "square";

    osc.frequency.setValueAtTime(
      900,
      now
    );


    gain.gain.setValueAtTime(
      0.0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.08,
      now + 0.001
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.03
    );


    osc.connect(gain);
    gain.connect(audioCtx.destination);


    osc.start(now);
    osc.stop(now + 0.035);
  }


  /*
   * ============================================================
   * KEYBOARD SOUND
   * ============================================================
   */
  document.addEventListener("keydown", (e) => {
    if (
      e.key === "Shift" ||
      e.key === "Control" ||
      e.key === "Alt" ||
      e.key === "Meta"
    ) {
      return;
    }

    playClick();
  });
</script>
</body>
</html>
