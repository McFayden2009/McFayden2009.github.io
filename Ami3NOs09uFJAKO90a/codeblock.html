<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CANTO3</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      visibility: hidden;
      background: #FFF;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .center-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: min(520px, 90vw);
      padding: 24px 28px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      backdrop-filter: blur(4px);
    }

    .code-row {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    .code-row label {
      min-width: 92px;
      text-transform: uppercase;
    }

    .code-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      outline: none;
      font-size: 15px;
      box-sizing: border-box;
    }

    .code-row input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .submit-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .submit-row button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      cursor: pointer;
      font-weight: 600;
    }

    .submit-row button.error {
      animation: redPulse 0.6s ease;
    }
    
    @keyframes redPulse {
      0% {
        transform: scale(1);
        background: rgba(255, 255, 255, 0.9);
      }
      25% {
        transform: scale(1.08);
        background: #ff4444;
      }
      50% {
        transform: scale(0.96);
        background: #cc0000;
      }
      75% {
        transform: scale(1.04);
        background: #ff4444;
      }
      100% {
        transform: scale(1);
        background: rgba(255, 255, 255, 0.9);
      }
    }


    .corner-image {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 30vw;
      height: 30vw;
      max-width: 30vh;
      max-height: 30vh;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <form id="articleForm" class="center-box" autocomplete="off">
      <div class="code-row">
        <label for="code1">Code 01:</label>
        <input id="code1" type="text" placeholder='_°_&#39;_._"N_°_&#39;_._E' autocomplete="off" spellcheck="false" />
      </div>

      <div class="code-row">
        <label for="code2">Code 02:</label>
        <input id="code2" type="text" placeholder='_______,_______,_______.' autocomplete="off" spellcheck="false" />
      </div>

      <div class="code-row">
        <label for="code3">Code 03:</label>
        <input id="code3" type="text" placeholder='_ _ _ _ _ _ _ _ _ _ _ _ _ _' autocomplete="off" spellcheck="false" />
      </div>

      <div class="submit-row">
        <button type="submit">Submit</button>
      </div>
    </form>

    <img class="corner-image" src="logo.png" alt="Logo" />
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    document.body.style.visibility = "visible";
    document.body.style.background = "linear-gradient(to bottom left, yellow, black)";
  });

  /*
   * ============================================================
   * ENCRYPTED WEBSITE A
   * Password = Code 1
   * ============================================================
   */
  const encryptedDataA = "REPLACE_WITH_ENCRYPTED_DATA_A";
  const saltB64A = "REPLACE_WITH_SALT_A";
  const ivB64A = "REPLACE_WITH_IV_A";

  /*
   * ============================================================
   * ENCRYPTED WEBSITE B
   * Password = Code 1 + Code 2
   * ============================================================
   */
  const encryptedDataB = "REPLACE_WITH_ENCRYPTED_DATA_B";
  const saltB64B = "REPLACE_WITH_SALT_B";
  const ivB64B = "REPLACE_WITH_IV_B";

  /*
   * ============================================================
   * ENCRYPTED WEBSITE C
   * Password = Code 1 + Code 2 + Code 3
   * ============================================================
   */
  const encryptedDataC = "REPLACE_WITH_ENCRYPTED_DATA_C";
  const saltB64C = "REPLACE_WITH_SALT_C";
  const ivB64C = "REPLACE_WITH_IV_C";


  function base64ToBytes(base64) {
    return Uint8Array.from(
      atob(base64),
      c => c.charCodeAt(0)
    );
  }


  async function deriveKey(password, salt) {
    const enc = new TextEncoder();

    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      enc.encode(password),
      { name: "PBKDF2" },
      false,
      ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: salt,
        iterations: 100000,
        hash: "SHA-256"
      },
      keyMaterial,
      {
        name: "AES-GCM",
        length: 256
      },
      false,
      ["decrypt"]
    );
  }


  async function decryptPayload(
    combinedPassword,
    encryptedData,
    saltB64,
    ivB64
  ) {
    const salt = base64ToBytes(saltB64);
    const iv = base64ToBytes(ivB64);
    const ciphertext = base64ToBytes(encryptedData);

    const key = await deriveKey(combinedPassword, salt);

    const decryptedBuffer = await crypto.subtle.decrypt(
      {
        name: "AES-GCM",
        iv: iv
      },
      key,
      ciphertext
    );

    /*
     * Your original code removes the final 10 characters.
     * This assumes your encrypted plaintext still has
     * the same 10-character padding at the end.
     */
    return new TextDecoder()
      .decode(decryptedBuffer)
      .slice(0, -10);
  }


  function showError() {
    const button = document.querySelector(".submit-row button");

    button.classList.remove("error");
    void button.offsetWidth;
    button.classList.add("error");
  }


  document
    .getElementById("articleForm")
    .addEventListener("submit", async (e) => {

      e.preventDefault();

      const code1 = document.getElementById("code1").value;
      const code2 = document.getElementById("code2").value;
      const code3 = document.getElementById("code3").value;

      let stage = null;
      let combinedPassword = null;
      let encryptedData = null;
      let saltB64 = null;
      let ivB64 = null;

      /*
       * --------------------------------------------------------
       * STAGE 1
       * Only Code 1 has been entered
       * --------------------------------------------------------
       */
      if (code1 && !code2 && !code3) {
        stage = "A";

        combinedPassword = code1;

        encryptedData = encryptedDataA;
        saltB64 = saltB64A;
        ivB64 = ivB64A;
      }

      /*
       * --------------------------------------------------------
       * STAGE 2
       * Code 1 + Code 2 have been entered
       * --------------------------------------------------------
       */
      else if (code1 && code2 && !code3) {
        stage = "B";

        combinedPassword = code1 + code2;

        encryptedData = encryptedDataB;
        saltB64 = saltB64B;
        ivB64 = ivB64B;
      }

      /*
       * --------------------------------------------------------
       * STAGE 3
       * All three codes have been entered
       * --------------------------------------------------------
       */
      else if (code1 && code2 && code3) {
        stage = "C";

        combinedPassword = code1 + code2 + code3;

        encryptedData = encryptedDataC;
        saltB64 = saltB64C;
        ivB64 = ivB64C;
      }

      /*
       * Invalid combination of fields
       */
      else {
        showError();
        return;
      }


      /*
       * For A and B, open a blank tab immediately.
       *
       * This is done before the async decryption because some
       * browsers will block window.open() after an await.
       */
      let newTab = null;

      if (stage === "A" || stage === "B") {
        newTab = window.open("about:blank", "_blank");

        if (newTab) {
          newTab.opener = null;
        }
      }


      try {
        const decryptedUrl = await decryptPayload(
          combinedPassword,
          encryptedData,
          saltB64,
          ivB64
        );

        /*
         * Optional safety check:
         * Make sure the decrypted value looks like a URL.
         */
        if (!/^https?:\/\//i.test(decryptedUrl)) {
          throw new Error("Invalid decrypted URL");
        }


        /*
         * ------------------------------------------------------
         * WEBSITE A
         * New tab
         * ------------------------------------------------------
         */
        if (stage === "A") {
          if (newTab) {
            newTab.location.href = decryptedUrl;
          } else {
            showError();
          }

          return;
        }


        /*
         * ------------------------------------------------------
         * WEBSITE B
         * New tab
         * ------------------------------------------------------
         */
        if (stage === "B") {
          if (newTab) {
            newTab.location.href = decryptedUrl;
          } else {
            showError();
          }

          return;
        }


        /*
         * ------------------------------------------------------
         * WEBSITE C
         * Same tab
         * ------------------------------------------------------
         */
        if (stage === "C") {
          window.location.href = decryptedUrl;
          return;
        }

      } catch (err) {
        console.log("Wrong code");

        /*
         * If a blank tab was opened but the password was wrong,
         * close it again.
         */
        if (newTab && !newTab.closed) {
          newTab.close();
        }

        showError();
      }
    });
</script>
</body>
</html>
